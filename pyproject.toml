[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "essm_jax"
version = "1.0.2"
description = "Extended State Space Modelling in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache Software License" }
authors = [{ name = "Joshua G. Albert", email = "albert@strw.leidenuniv.nl" }]
keywords = ["kalman", "non-linear", "EKF", "modelling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent"
]
urls = { "Homepage" = "https://github.com/joshuaalbert/essm_jax" }
dependencies = [
    "jax>=0.6.0",
    "jaxlib",
    "numpy",
    "tfp-nightly",
]

[project.optional-dependencies]
tests = [
    "flake8",
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
    "twine",
]
examples = [
    "matplotlib",
    "jupyter",
    "jaxns",
]

[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["essm_jax"]
omit = ["*/tests/*"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 127

[tool.ruff.lint]
# Match the existing CI's syntax and undefined-name gate without a style rewrite.
select = ["E9", "F63", "F7", "F82"]
